name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tests/.cache
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('templates/common/build.sh', 'templates/common/requirements.txt', 'templates/*/latex/tex-packages.txt') }}
      - name: Build templates and demo paper
        run: tests/run-tests.sh --setup
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: ${{ runner.temp }}/paper-forge-tests.*
